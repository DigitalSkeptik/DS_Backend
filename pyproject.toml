[tool.poetry]
authors = ["Nikita <sared3420@gnail.com>"]
description = "DigitalSkeptik Backend."
name = "app"
version = "0.0.1"
package-mode = false

[tool.poetry.dependencies]
python = "^3.13"

alembic = "^1.17.2"
asyncpg = "^0.31.0"
bcrypt = "^5.0.0"
fastapi = "^0.128.0"
pydantic = { extras = ["dotenv", "email"], version = "^2.12.5" }
pydantic-settings = "^2.12.0"
pyjwt = "^2.10.1"
python-multipart = "^0.0.21"
slowapi = "^0.1.9"
sqlalchemy = { extras = ["asyncio"], version = "^2.0.45" }

[tool.poetry.group.dev.dependencies]
coverage = "^7.13.0"
freezegun = "^1.5.5"
greenlet = "^3.3.0"
httpx = "^0.28.1"
mypy = "^1.19.1"
pre-commit = "^4.5.1"
pytest = "^9.0.2"
pytest-asyncio = "^1.0.0"
pytest-cov = "^7.0.0"
pytest-xdist = "^3.8.0"
ruff = "^0.14.10"
uvicorn = { extras = ["standard"], version = "^0.40.0" }

[build-system]
build-backend = "poetry.core.masonry.api"
requires = ["poetry-core>=1.0.0"]

[tool.pytest.ini_options]
addopts = "-vv -n auto --cov --cov-report xml --cov-report term-missing --cov-fail-under=66"
asyncio_default_fixture_loop_scope = "session"
asyncio_mode = "auto"
testpaths = ["app/tests"]

[tool.coverage.run]
concurrency = ["greenlet"]
omit = ["app/tests/*"]
source = ["app"]

[tool.mypy]
python_version = "3.13"
strict = true
exclude = ["alembic"]

[tool.ruff]
target-version = "py313"
extend-exclude = ["alembic", "app/tests/conftest.py"]

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pylint, pyupgrade
ignore = ["E501"]
select = ["E", "F", "I", "PL", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
# Ignore magic value comparisons in tests
"app/tests/**/*.py" = ["PLR2004", "PLC0415"]
